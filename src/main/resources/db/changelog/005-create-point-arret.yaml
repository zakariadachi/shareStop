
databaseChangeLog:
  - changeSet:
      id: 005-create-point-arret
      author: zakaria
      changes:
        - createTable:
            tableName: points_arret
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false

              - column:
                  name: ville
                  type: VARCHAR(100)
                  constraints:
                    nullable: false

              - column:
                  name: heure_passage
                  type: TIMESTAMP
                  constraints:
                    nullable: false

              - column:
                  name: prix_depuis_depart
                  type: DECIMAL(10,2)
                  constraints:
                    nullable: false

              - column:
                  name: ordre
                  type: INT
                  constraints:
                    nullable: false

              - column:
                  name: trajet_id
                  type: BIGINT
                  constraints:
                    nullable: false

        - addForeignKeyConstraint:
            baseTableName: points_arret
            baseColumnNames: trajet_id
            referencedTableName: trajets
            referencedColumnNames: id
            constraintName: fk_points_arret_trajet

        - addUniqueConstraint:
            tableName: points_arret
            columnNames: trajet_id, ordre
            constraintName: uk_points_arret_trajet_ordre
